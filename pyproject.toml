[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "weightatlas"
version = "0.1.0"
description = "Local AI model exploration platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.scripts]
weightatlas = "weightatlas:main"

[tool.setuptools]
py-modules = ["weightatlas"]
